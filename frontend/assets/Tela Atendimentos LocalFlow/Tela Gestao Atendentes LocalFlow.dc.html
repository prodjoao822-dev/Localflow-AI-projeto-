<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style> body { margin: 0; background: #1F2933; } * { box-sizing: border-box; } </style>
</helmet>

<div style="display:flex; width:100%; height:100vh; min-width:960px; background:#1F2933; color:#E5E7EB; font-family:'IBM Plex Sans', sans-serif; overflow:hidden;">

  <!-- SIDEBAR -->
  <div style="flex:0 0 200px; display:flex; flex-direction:column; background:#161B22; border-right:1px solid #262F3A; padding:22px 16px;">
    <div style="display:flex; align-items:center; gap:10px; padding:0 8px 26px 8px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3C7 3 4 6 4 10c0 3 1.8 5.3 4.5 6.4L12 21l1-3.2c3.6-.6 6-3.4 6-7.8 0-4-3-7-7-7z" stroke="#22C55E" stroke-width="1.5"/><path d="M8.5 10.5h7M9 13h5" stroke="#22C55E" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div style="font-family:'Plus Jakarta Sans', sans-serif; font-size:18px; font-weight:800; color:#F5F5F5;">LocalFlow <span style="color:#22C55E;">AI</span></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:2px; flex:1;">
      <div style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:#5B6675; cursor:default;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
        <span style="font-size:14px; font-weight:500;">Dashboard</span>
      </div>
      <div style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:#5B6675; cursor:default;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 20c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="17" cy="9" r="2.3" stroke="currentColor" stroke-width="1.6"/><path d="M15.2 14.8c2.4.3 4.3 2.1 4.3 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span style="font-size:14px; font-weight:500;">Clientes</span>
      </div>
      <div style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:#5B6675; cursor:default;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l7.5 4.3v9.4L12 21l-7.5-4.3V7.3L12 3z" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 7.3L12 11.6l7.5-4.3M12 11.6V21" stroke="currentColor" stroke-width="1.6"/></svg>
        <span style="font-size:14px; font-weight:500;">Produtos e Serviços</span>
      </div>
      <div style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:#5B6675; cursor:default;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 3.5h9l3 3V21H6V3.5z" stroke="currentColor" stroke-width="1.6"/><path d="M9 9h6M9 12.5h6M9 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span style="font-size:14px; font-weight:500;">Orçamentos</span>
      </div>
      <div style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:#5B6675; cursor:default;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v10H9.5L5.5 19v-3.5H4v-10z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span style="font-size:14px; font-weight:500;">Atendimentos</span>
      </div>
      <div style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:#5B6675; cursor:default;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8l8-4 8 4-8 4-8-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span style="font-size:14px; font-weight:500;">Operação</span>
      </div>
      <div style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:#5B6675; cursor:default;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 3v4M15 3v4M6 9h4v4a2 2 0 002 2 2 2 0 002-2V9h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span style="font-size:14px; font-weight:500;">Integrações</span>
      </div>
      <div style="display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; background:rgba(34,197,94,0.12); color:#22C55E; position:relative;">
        <div style="position:absolute; left:-16px; top:6px; bottom:6px; width:3px; background:#22C55E; border-radius:0 3px 3px 0;"></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.6"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span style="font-size:14px; font-weight:600;">Configurações</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px; padding:12px 8px; border-top:1px solid #262F3A;">
      <div style="width:32px; height:32px; border-radius:50%; background:rgba(34,197,94,0.18); color:#22C55E; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;">A</div>
      <div style="flex:1;"><div style="font-size:13px; font-weight:600; color:#E5E7EB;">Admin</div><div style="font-size:11.5px; color:#6B7684;">admin@localflow.ai</div></div>
    </div>
  </div>

  <!-- MAIN -->
  <div style="flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden;">
    <div style="padding:22px 32px; border-bottom:1px solid #262F3A; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;">
      <div>
        <div style="font-size:12px; color:#6B7684; margin-bottom:4px;">Configurações</div>
        <div style="font-family:'Plus Jakarta Sans', sans-serif; font-size:24px; font-weight:800; color:#F5F5F5;">Atendentes</div>
        <div style="font-size:13.5px; color:#8B96A5; margin-top:4px;">Quem tem acesso ao painel do seu negócio</div>
      </div>
      <button onclick="{{ openModal }}" style="display:flex; align-items:center; gap:8px; padding:10px 18px; background:#22C55E; border:none; border-radius:8px; color:#0F1712; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; white-space:nowrap;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Adicionar atendente
      </button>
    </div>

    <div style="flex:1; overflow-y:auto; padding:24px 32px;">
      <div style="max-width:720px; border:1px solid #2E3844; border-radius:12px; overflow:hidden;">
        <div style="display:grid; grid-template-columns:1.4fr 1.6fr 0.8fr; padding:12px 18px; background:#1D2530; border-bottom:1px solid #2E3844;">
          <span style="font-size:12px; font-weight:600; color:#8B96A5;">Nome</span>
          <span style="font-size:12px; font-weight:600; color:#8B96A5;">E-mail</span>
          <span style="font-size:12px; font-weight:600; color:#8B96A5;">Status</span>
        </div>
        <sc-for list="{{ attendants }}" as="a" hint-placeholder-count="3">
          <div style="display:grid; grid-template-columns:1.4fr 1.6fr 0.8fr; padding:14px 18px; border-bottom:1px solid #2E3844; align-items:center;">
            <span style="font-size:13.5px; font-weight:600; color:#F0F2F5;">{{ a.name }}</span>
            <span style="font-size:13px; color:#B7C0CC;">{{ a.email }}</span>
            <button onclick="{{ a.toggle }}" style="justify-self:start; display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; background:{{ a.statusBg }}; color:{{ a.statusColor }}; border:none; cursor:pointer; font-family:inherit;">
              <span style="width:6px; height:6px; border-radius:50%; background:{{ a.statusColor }};"></span>
              {{ a.statusLabel }}
            </button>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
    <div onclick="{{ closeModal }}" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:10;">
      <div onclick="{{ stopClick }}" style="width:100%; max-width:380px; background:#242E38; border:1px solid #37424F; border-radius:14px; padding:24px;">
        <div style="font-size:15px; font-weight:700; color:#F5F5F5; margin-bottom:16px;">Novo atendente</div>
        <div style="display:flex; flex-direction:column; gap:14px;">
          <div>
            <label style="display:block; font-size:12.5px; font-weight:600; color:#B7C0CC; margin-bottom:6px;">Nome</label>
            <input value="{{ formName }}" oninput="{{ onFormName }}" placeholder="Nome completo" style="width:100%; background:#1B242D; border:1px solid #37424F; border-radius:8px; padding:10px 12px; color:#E5E7EB; font-size:13.5px; font-family:inherit; outline:none;"/>
          </div>
          <div>
            <label style="display:block; font-size:12.5px; font-weight:600; color:#B7C0CC; margin-bottom:6px;">E-mail</label>
            <input value="{{ formEmail }}" oninput="{{ onFormEmail }}" placeholder="nome@negocio.com" style="width:100%; background:#1B242D; border:1px solid #37424F; border-radius:8px; padding:10px 12px; color:#E5E7EB; font-size:13.5px; font-family:inherit; outline:none;"/>
          </div>
          <div style="display:flex; gap:10px; margin-top:6px;">
            <button onclick="{{ closeModal }}" style="flex:1; padding:10px; background:#26303B; border:1px solid #37424F; border-radius:8px; color:#E5E7EB; font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer;">Cancelar</button>
            <button onclick="{{ addAttendant }}" style="flex:1; padding:10px; background:#22C55E; border:none; border-radius:8px; color:#0F1712; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer;">Adicionar</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
function seedAttendants() {
  return [
    { id: 1, name: 'Ana P.', email: 'ana@localflow.ai', active: true },
    { id: 2, name: 'Carlos M.', email: 'carlos@localflow.ai', active: true },
    { id: 3, name: 'Bruna Lima', email: 'bruna@localflow.ai', active: false },
  ];
}

class Component extends DCLogic {
  state = { attendants: seedAttendants(), modalOpen: false, formName: '', formEmail: '' };

  toggle(id) { this.setState(s => ({ attendants: s.attendants.map(a => a.id === id ? { ...a, active: !a.active } : a) })); }
  openModal() { this.setState({ modalOpen: true }); }
  closeModal() { this.setState({ modalOpen: false, formName: '', formEmail: '' }); }
  onFormName(e) { this.setState({ formName: e.target.value }); }
  onFormEmail(e) { this.setState({ formEmail: e.target.value }); }

  addAttendant() {
    const name = this.state.formName.trim();
    const email = this.state.formEmail.trim();
    if (!name || !email) return;
    this.setState(s => ({
      attendants: [...s.attendants, { id: Date.now(), name, email, active: true }],
      modalOpen: false, formName: '', formEmail: '',
    }));
  }

  renderVals() {
    const attendants = this.state.attendants.map(a => ({
      id: a.id, name: a.name, email: a.email,
      statusLabel: a.active ? 'Ativo' : 'Inativo',
      statusBg: a.active ? 'rgba(74,222,128,0.14)' : 'rgba(148,163,184,0.14)',
      statusColor: a.active ? '#4ADE80' : '#94A3B8',
      toggle: () => this.toggle(a.id),
    }));
    return {
      attendants, modalOpen: this.state.modalOpen,
      formName: this.state.formName, formEmail: this.state.formEmail,
      onFormName: (e) => this.onFormName(e), onFormEmail: (e) => this.onFormEmail(e),
      openModal: () => this.openModal(), closeModal: () => this.closeModal(),
      addAttendant: () => this.addAttendant(),
      stopClick: (e) => e.stopPropagation(),
    };
  }
}

</script>
</body>
</html>
